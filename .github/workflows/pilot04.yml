name: Pilot 04 — Scrapy vs Crawlee (local synthetic only)

on:
  pull_request:
    paths:
      - "experiments/pilot04/**"
      - ".github/workflows/pilot04.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f3tcher-pilot04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CRAWLEE_STORAGE_DIR: /tmp/pilot04-crawlee-storage
      CRAWLEE_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned top-level crawler dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check scrapy==2.19.0
          npm install --prefix experiments/pilot04 --no-audit --no-fund
          python -m pip freeze > "$RUNNER_TEMP/pilot04-pip-freeze.txt"
          npm ls --prefix experiments/pilot04 --depth=0 > "$RUNNER_TEMP/pilot04-npm-versions.txt"
      - name: Start only third-party MIT fixture on localhost
        shell: bash
        run: |
          node experiments/pilot03/serve.mjs > "$RUNNER_TEMP/pilot04-base.txt" 2> "$RUNNER_TEMP/pilot04-fixture-stderr.txt" &
          echo "$!" > "$RUNNER_TEMP/pilot04-fixture.pid"
          for i in $(seq 1 20); do
            if grep -q '^http://127.0.0.1:' "$RUNNER_TEMP/pilot04-base.txt"; then break; fi
            sleep 0.3
          done
          BASE_URL="$(head -n 1 "$RUNNER_TEMP/pilot04-base.txt")"
          test -n "$BASE_URL"
          case "$BASE_URL" in http://127.0.0.1:*) ;; *) exit 1 ;; esac
          curl --fail --silent --show-error "$BASE_URL/robots.txt" >/dev/null
          echo "BASE_URL=$BASE_URL" >> "$GITHUB_ENV"
      - name: Scrapy real spider (HTTP + explicit publisher API, no JS)
        shell: bash
        run: |
          scrapy runspider experiments/pilot04/scrapy_spider.py \
            -a "base=$BASE_URL" \
            -O "$RUNNER_TEMP/pilot04-scrapy.jsonl:jsonlines"
      - name: Crawlee real CheerioCrawler and HttpCrawler (no browser)
        shell: bash
        run: |
          node experiments/pilot04/crawlee_runner.mjs "$RUNNER_TEMP/pilot04-crawlee.json"
      - name: Evaluate only against frozen third-party gold
        shell: bash
        run: |
          python experiments/pilot04/evaluate.py \
            --scrapy "$RUNNER_TEMP/pilot04-scrapy.jsonl" \
            --crawlee "$RUNNER_TEMP/pilot04-crawlee.json" \
            --output "$RUNNER_TEMP/pilot04-evaluation.json"
      - name: Upload small verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f3tcher-pilot04-local
          path: |
            ${{ runner.temp }}/pilot04-*.json
            ${{ runner.temp }}/pilot04-*.jsonl
            ${{ runner.temp }}/pilot04-*.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Stop local fixture
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/pilot04-fixture.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pilot04-fixture.pid")" 2>/dev/null || true
          fi
